      ';</' + 'script>';

    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

amond',serif;font-size:var(--step-2);font-weight:600;color:var(--text);line-height:1.1;margin-bottom:12px;\">Consultá sin cargo<\u002Fh3>\n        <p style=\"font-family:'Source Sans 3',sans-serif;font-size:var(--step-0);color:var(--text-2);line-height:1.65;max-width:32ch;text-wrap:pretty;\">Contanos tu proyecto y te asesoramos qué línea Hunter Douglas se adapta mejor a cada ambiente.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"fade-up s1\">\n        <p style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,6vw,5rem);font-weight:600;color:var(--neutral);line-height:1;letter-spacing:-0.03em;margin-bottom:var(--space-2);\">02<\u002Fp>\n        <h3 style=\"font-family:'Cormorant Garamond',serif;font-size:var(--step-2);font-weight:600;color:var(--text);line-height:1.1;margin-bottom:12px;\">Elegí tu línea<\u002Fh3>\n        <p style=\"font-family:'Source Sans 3',sans-serif;font-size:var(--step-0);color:var(--text-2);line-height:1.65;max-width:32ch;text-wrap:pretty;\">Exploramos juntos el catálogo Hunter Douglas: telas, colores, mecanismos y niveles de automatización.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"fade-up s2\">\n        <p style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,6vw,5rem);font-weight:600;color:var(--neutral);line-height:1;letter-spacing:-0.03em;margin-bottom:var(--space-2);\">03<\u002Fp>\n        <h3 style=\"font-family:'Cormorant Garamond',serif;font-size:var(--step-2);font-weight:600;color:var(--text);line-height:1.1;margin-bottom:12px;\">Medición y presupuesto<\u002Fh3>\n        <p style=\"font-family:'Source Sans 3',sans-serif;font-size:var(--step-0);color:var(--text-2);line-height:1.65;max-width:32ch;text-wrap:pretty;\">Vamos a tu obra, tomamos medidas exactas y te entregamos un presupuesto detallado sin sorpresas.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"fade-up s3\">\n        <p style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,6vw,5rem);font-weight:600;color:var(--accent);line- .style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.4)'\">Por qué elegirnos<\u002Fa>\n      <a href=\"#productos\" style=\"color:rgba(255,255,255,0.4);text-decoration:none;font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.4)'\">Productos<\u002Fa>\n      <a href=\"#galeria\" style=\"color:rgba(255,255,255,0.4);text-decoration:none;font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.4)'\">Trabajos<\u002Fa>\n      <a href=\"#proceso\" style=\"color:rgba(255,255,255,0.4);text-decoration:none;font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.4)'\">Proceso<\u002Fa>\n      <a href=\"#contacto\" style=\"color:rgba(255,255,255,0.4);text-decoration:none;font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.4)'\">Contacto<\u002Fa>\n    <\u002Fnav>\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px;\">\n      <p style=\"font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:rgba(255,255,255,0.25);\">Seguinos<\u002Fp>\n      <div style=\"display:flex;gap:16px;\">\n        <a href=\"#\" aria-label=\"Instagram\" style=\"color:rgba(255,255,255,0.35);text-decoration:none;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.35)'\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"5\"><\u002Frect><path d=\"M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z\"><\u002Fpath><line x1=\"17.5\" y1=\"6.5\" x2=\"17.51\" y2=\"6.5\"><\u002Fline><\u002Fsvg><\u002Fa>\n        <a href=\"#\" aria-label=\"Facebook\" style=\"color:rgba(255,255,255,0.35);text-decoration:none;transition:color 200ms;\" onmouseenter=\"this.style.color='white'\" onmouseleave=\"this.style.color='rgba(255,255,255,0.35)'\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1280px;margin:0 auto;padding-top:24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;\">\n    <p style=\"font-family:'Source Sans 3',sans-serif;font-size:var(--step--1);color:rgba(255,255,255,0.2);\">© 2026 Virginia Zab — Persianas.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._observers = [];\n    this._carouselTimer = null;\n    this._dragging = false;\n    this._hintHidden = false;\n    this.initNavbar();\n    this.initCarousel();\n    this.initScrollAnimations();\n    this.initCredSeps();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._carouselTimer);\n    this._observers.forEach(o => o.disconnect());\n    window.removeEventListener('scroll', this._onScroll);\n    document.removeEventListener('mousemove', this._onMouseMove);\n    document.removeEventListener('mouseup', this._onMouseUp);\n    document.removeEventListener('touchmove', this._onTouchMove);\n    document.removeEventListener('touchend', this._onTouchEnd);\n    document.removeEventListener('keydown', this._onKeydown);\n  }\n\n  initNavbar() {\n    const nav = document.querySelector('.navbar');\n    if (!nav) return;\n    this._onScroll = () => nav.classList.toggle('navbar--solid', window.scrollY > 70);\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n  }\n\n  initCarousel() {\n    const slides = document.querySelectorAll('.hero__slide');\n    const dots = document.querySelectorAll('.hero__dot');\n    const srEl = document.getElementById('hero-sr');\n    if (!slides.length) return;\n    const total = slides.length;\n    let cur = 0;\n    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n    const goTo = (n) => {\n      slides[cur].classList.remove('is-active');\n      slides[cur].setAttribute('aria-hidden', 'true');\n      dots[cur].classList.remove('is-active');\n      dots[cur].setAttribute('aria-selected', 'false');\n      cur = ((n % total) + total) % total;\n      slides[cur].classList.add('is-active');\n      slides[cur].setAttribute('aria-hidden', 'false');\n      dots[cur].classList.add('is-active');\n      dots[cur].setAttribute('aria-selected', 'true');\n      if (srEl) srEl.textContent = `Slide ${cur + 1} de ${total}`;\n    };\n\n    const startTimer = () => {\n      clearInterval(this._carouselTimer);\n      if (!prefersReduced) this._carouselTimer = setInterval(() => goTo(cur + 1), 5000);\n    };\n    startTimer();\n\n    const hero = document.getElementById('hero');\n    if (hero) {\n      hero.addEventListener('mouseenter', () => clearInterval(this._carouselTimer));\n      hero.addEventListener('mouseleave', startTimer);\n      hero.addEventListener('focusin', () => clearInterval(this._carouselTimer));\n      hero.addEventListener('focusout', startTimer);\n      let tx = 0;\n      hero.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });\n      hero.addEventListener('touchend', (e) => {\n        const d = tx - e.changedTouches[0].clientX;\n        if (Math.abs(d) > 50) { goTo(d > 0 ? cur + 1 : cur - 1); startTimer(); }\n      });\n    }\n\n    dots.forEach((dot, i) => dot.addEventListener('click', () => { goTo(i); startTimer(); }));\n\n    this._onKeydown = (e) => {\n      if (e.key === 'ArrowRight') { goTo(cur + 1); startTimer(); }\n      else if (e.key === 'ArrowLeft') { goTo(cur - 1); startTimer(); }\n    };\n    document.addEventListener('keydown', this._onKeydown);\n  }\n\n  initScrollAnimations() {\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const obs = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); obs.unobserve(e.target); } });\n    }, { threshold: 0.08, rootMargin: '0px 0px -32px 0px' });\n    document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));\n    this._observers.push(obs);\n  }\n\n  initCredSeps() {\n    const update = () => {\n      const wide = window.innerWidth >= 768;\n      document.querySelectorAll('.cred-sep').forEach(el => { el.style.display = wide ? 'block' : 'none'; });\n    };\n    update();\n    window.addEventListener('resize', update, { passive: true });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
